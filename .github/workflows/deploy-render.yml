# 프론트엔드는 Vercel, 백엔드만 Render 배포 훅을 호출합니다.
name: Deploy backend to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger backend deploy
        run: |
          if [ -z "$RENDER_BACKEND_DEPLOY_HOOK" ]; then
            echo "RENDER_BACKEND_DEPLOY_HOOK secret not set; skipping backend deploy hook."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_BACKEND_DEPLOY_HOOK"
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
